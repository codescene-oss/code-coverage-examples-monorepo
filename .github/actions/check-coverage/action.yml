name: 'Check Coverage'
description: 'Used to check coverage data during build'
inputs:
  access-token:
    required: true
  project-id:
    description: 'CodeScene project ID'
    required: true
  onprem-url:
    description: 'Base URL for CodeScene On-prem'
    required: false
  coverage-files:
    required: true
runs:
  using: "composite"
  steps:
    - name: Download cs-coverage binary, unzip it and make it executable
      run: |
        curl -s -o "$(pwd)/cs-coverage.zip" https://downloads.codescene.io/enterprise/cli/cs-coverage-linux-amd64-latest.zip
        unzip -oq "$(pwd)/cs-coverage.zip"
        chmod +x "$(pwd)/cs-coverage"
      shell: bash
    - name: CodeScene Code Coverage Check
      run: |
        ls -alR $(pwd)/coverage/
        $(pwd)/cs-coverage check --project-id "$PROJECT_ID" --verbose --coverage-files "${{ inputs.coverage-files }}"
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        CS_ONPREM_URL: ${{ inputs.onprem-url }}
        CS_ACCESS_TOKEN: ${{ inputs.access-token }}
      shell: bash
